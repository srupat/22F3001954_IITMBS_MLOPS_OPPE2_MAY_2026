name: OPPE2 CI CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: mlops-499806
  REGION: us-central1
  ZONE: us-central1-a
  CLUSTER_NAME: oppe2-heart-cluster
  AR_REPO: oppe2-repo
  NAMESPACE: heart-disease

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train model
        run: |
          python src/train.py

      - name: Run tests
        run: |
          pytest tests -v

      - name: Configure Artifact Registry Docker auth
        run: |
          gcloud auth configure-docker \
            ${REGION}-docker.pkg.dev \
            --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/heart-disease-api"

          docker build \
            -t "${IMAGE_URI}:${GITHUB_SHA}" \
            -t "${IMAGE_URI}:latest" \
            .

          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.ZONE }}

      - name: Deploy to GKE
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/heart-disease-api:${GITHUB_SHA}"

          kubectl apply -f k8s/namespace.yaml

          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            k8s/deployment.yaml \
            | kubectl apply -f -

          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          kubectl rollout status \
            deployment/heart-disease-api \
            -n ${NAMESPACE} \
            --timeout=180s

          kubectl get pods -n ${NAMESPACE}
          kubectl get hpa -n ${NAMESPACE}
          kubectl get service -n ${NAMESPACE}
